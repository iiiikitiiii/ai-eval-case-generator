server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 病历图片上传——默认 1m 太小，用例工坊一次经常传好几张病历照片。
    client_max_body_size 25m;

    # 反代到后端容器，前端只用相对路径 /api/... 请求（见 Dockerfile.prod
    # 里 VITE_API_BASE_URL=/api 这个构建参数）。这样部署只需要对外开一个
    # 端口（这个 nginx 的 80），不用单独暴露 backend 的 8000；同源请求也
    # 顺带让 CORS_ORIGINS 配置在内部部署场景里基本用不上。
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Agent F 单次运行观察到接近 5 分钟——反代的读超时不能用 nginx
        # 默认的 60s，会在模型还在思考的时候就把连接掐断。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # React Router 的客户端路由——非文件请求一律回退到 index.html，不然
    # 直接刷新 /board 这种子路径会从 nginx 拿到 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源可以放心长期缓存——vite build 产物文件名都带内容 hash，
    # 内容变了文件名也会变，不存在"缓存到旧版本"的问题；index.html 本身
    # 不在这个 location 里，不会被这条规则误缓存。
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
