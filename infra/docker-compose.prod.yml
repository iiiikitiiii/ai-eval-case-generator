# 生产/内部部署用——跟 docker-compose.yml（本地开发：--reload、源码挂载、
# 数据库/Redis/MinIO 端口全部暴露到宿主机、默认弱密码）分开维护，不要
# 合并。核心差异：
#   - postgres/redis/minio 不对外暴露端口，只在 compose 内部网络里被
#     backend/worker 访问——外部拿不到数据库连接串就没法直连。
#   - 前后端不再各开一个端口：nginx（frontend 服务）反代 /api 到
#     backend，对外只需要开一个端口。
#   - 镜像里没有源码挂载，代码是 build 时打进镜像的——改代码要重新
#     build + up，不是改完文件容器立刻生效（这是有意的：生产环境不该有
#     "改一下文件线上行为就变了"这种隐式联动）。
#   - 密码/密钥必须通过 infra/.env.prod 提供，这个 compose 文件里没有
#     任何默认值兜底（跟 docker-compose.yml 那份"caseflow/caseflow"这种
#     开发期弱密码明确区分开）。
#
# 用法见 doc/内部部署指南.md。

name: case-pipeline-hub

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-caseflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须在 .env.prod 里设置真实密码}
      POSTGRES_DB: ${POSTGRES_DB:-caseflow}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caseflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: ["redis-data:/data"]
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?必须在 .env.prod 里设置}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?必须在 .env.prod 里设置，至少 8 位}
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: case-pipeline-hub-backend:latest
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-caseflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-caseflow}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: minio:9000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # worker 跟 backend 是完全同一份代码、同一个镜像，只是 command 不同
  # （arq worker 而不是 uvicorn）——显式给两个服务同一个 image 名字，
  # `docker compose build` 只会真正 build 一次，离线打包时 `docker save`
  # 也只需要存一份，不用把同样 400 多 MB 的内容重复打包两次。
  worker:
    image: case-pipeline-hub-backend:latest
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-caseflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-caseflow}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: minio:9000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    command: ["arq", "app.workers.worker.WorkerSettings"]

  frontend:
    image: case-pipeline-hub-frontend:latest
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend: { condition: service_healthy }

volumes:
  pgdata:
  redis-data:
  minio-data:
